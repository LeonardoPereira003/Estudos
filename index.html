    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício OO em JS</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <!-- Container principal para o conteúdo -->
    <main class="container">
        <h1>Exercício de Orientação a Objetos em JavaScript</h1>

        <!-- Descrição da tarefa -->
        <section class="descricao">
        <p>
            Neste exercício você deve:
            <ul>
            <li>✅ Criar uma <strong>classe de uma abstração</strong></li>
            <li>✅ Criar pelo menos <strong>duas classes herdeiras</strong></li>
            <li>✅ Criar <strong>três instâncias de objetos</strong></li>
            <li>✅ Subir o código para uma <strong>branch chamada oo_js</strong> no GitHub</li>
            </ul>
        </p>
        </section>

        <!-- Onde será exibido o resultado do JS -->
        <section id="output" class="output-area">
        <!-- JS vai inserir aqui os resultados -->
        </section>

        <!-- Botão de execução -->
        <div class="actions">
        <button id="executar">Executar Código</button>
        </div>
    </main>

    <!-- Link do seu JS -->
    <script src="script.js"></script>
    </body>
    </html>
