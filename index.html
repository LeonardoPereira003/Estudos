    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora VueJS</title>

    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css" />

    <!-- Importa Vue 3 via CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
    <!-- Div que será controlada pelo Vue -->
    <div id="app">
        <div class="calc">
        <h2>🧮 Calculadora VueJS</h2>

        <!-- Campo de input para o primeiro número -->
        <input type="number" v-model.number="num1" placeholder="Digite o primeiro número" />

        <!-- Campo de input para o segundo número -->
        <input type="number" v-model.number="num2" placeholder="Digite o segundo número" />

        <!-- Select para escolher a operação aritmética (com label para acessibilidade) -->
        <label for="operacao">Escolha a operação:</label>
        <select id="operacao" v-model="operacao">
            <option value="+">Soma (+)</option>
            <option value="-">Subtração (-)</option>
            <option value="*">Multiplicação (*)</option>
            <option value="/">Divisão (/)</option>
        </select>

        <!-- Exibição automática do resultado -->
        <div class="resultado">
            Resultado: {{ resultado }}
        </div>
        </div>
    </div>

    <!-- Script do VueJS com a lógica da calculadora -->
    <script src="app.js"></script>
    </body>
    </html>
